spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  data:
    redis:
      url: ${REDIS_URL}

decisionhub:
  integration1:
    runtime:
      # production 明确禁用 NQ_DRYRUN endpoint；不得通过 base 默认值误开启。
      enabled: false
      production-enabled: false
      kill-switch-enabled: true
      allowed-sources: ""
      allowed-tenant-source-pairs: ""
  security:
    nq-feedback:
      replay:
        # prod 强制持久化防重放；不得退回无界 in-memory。
        guard-type: jdbc
        cleanup-enabled: true
