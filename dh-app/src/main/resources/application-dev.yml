spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/decision_hub
    username: postgres
    password: 123456
  data:
    redis:
      url: redis://localhost:6379

decisionhub:
  integration1:
    runtime:
      # dev profile 可显式开启；默认仍关闭，避免误把 dry-run endpoint 当作 runtime integration。
      enabled: false
      production-enabled: false
      allowed-sources: NQ_DRYRUN
      allowed-tenant-source-pairs: ""
  security:
    nq-feedback:
      replay:
        # dev profile 允许进程内 in-memory 防重放（单实例，无需 DB）。生产严禁。
        guard-type: in-memory
