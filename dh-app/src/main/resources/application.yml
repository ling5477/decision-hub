server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/decision_hub}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

decisionhub:
  security:
    nq-feedback:
      replay:
        # 防重放 guard 实现：jdbc(持久化) | in-memory(仅 dev/test)。
        # 默认 jdbc：多实例/重启后窗口内重放仍被拒；非 dev/test 不得用无界 in-memory。
        guard-type: jdbc
        # jdbc 实现登记前惰性清理过期行，保证存储有界增长。
        cleanup-enabled: true
